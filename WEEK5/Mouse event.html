<!DOCTYPE html>
<html>
<head>
    <title>Mouse Events</title>
</head>
<body>

<h2>Mouse Events on Image</h2>

<img id="myImage" src="https://images.unsplash.com/photo-1587831990711-23ca6441447b?q=80&w=1031&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" width="300" alt="Sample Image">

<p id="message">Perform an action on the image.</p>

<script>
let image = document.getElementById("myImage");
let message = document.getElementById("message");

image.addEventListener("mouseover", function() {
    message.textContent = "Mouse is over the image";
});

image.addEventListener("mouseout", function() {
    message.textContent = "Mouse moved out of the image";
});

image.addEventListener("click", function() {
    message.textContent = "Image clicked";
});
</script>

</body>
</html>
